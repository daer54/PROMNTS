<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estudio · Prompts</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><dialog id="importDialog"><form method="dialog"><header><h2>Organizar respuesta</h2><button aria-label="Cerrar">✕</button></header></form><p>Pega tu respuesta completa. Revisarás el resultado antes de guardarlo.</p><textarea id="sourceInput" placeholder="Personaje 1: Luna&#10;Descripción del personaje…&#10;&#10;Escena 1&#10;Prompt de imagen: …&#10;Prompt de video: …"></textarea><button id="organize" class="primary">Organizar y revisar</button><div id="review"></div></dialog><dialog id="assignDialog"><h2>Asignar contenido</h2><label>Tipo<select id="assignKind"><option value="image">Prompt de imagen</option><option value="video">Prompt de video</option><option value="character">Personaje</option><option value="delete">Eliminar</option></select></label><label>Destino<select id="assignScene"></select></label><label>Nombre nuevo<input id="assignName" placeholder="Nombre del personaje o escena"></label><label>Si el destino ya tiene texto<select id="assignMode"><option value="append">Añadir al contenido</option><option value="replace">Reemplazar contenido</option></select></label><p id="assignmentNote"></p><footer><button id="cancelAssign">Cancelar</button><button id="confirmAssign" class="primary">Aplicar</button></footer></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
